<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Renglones de Caligrafía - 1er Grado</title>
<style>
  body {
    margin: 0;
    padding: 20px;
  }
  .renglon {
    height: 20mm; /* altura total */
    border-bottom: 1px solid #000; /* línea base */
    position: relative;
  }
  .renglon::before {
    content: "";
    position: absolute;
    top: 10mm; /* línea media */
    left: 0;
    right: 0;
    border-top: 1px dashed #888;
  }
  .renglon::after {
    content: "";
    position: absolute;
    top: 0; /* línea superior */
    left: 0;
    right: 0;
    border-top: 1px solid #000;
  }
</style>
</head>
<body>
  <!-- Generar varias líneas -->
  <div class="renglon"></div>
  <div class="renglon"></div>
  <div class="renglon"></div>
  <div class="renglon"></div>
  <div class="renglon"></div>
  <div class="renglon"></div>
</body>
</html>
